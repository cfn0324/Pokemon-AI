<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝可梦AI - 实时仪表盘</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h1 { font-size: 26px; margin-bottom: 6px; }
        .subtitle { opacity: 0.85; }
        .badge {
            display: inline-block; padding: 4px 10px; margin-right: 8px;
            background: #22c55e; color: #0f172a; border-radius: 14px; font-size: 12px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1.3fr 0.8fr;
            gap: 16px;
        }
        .panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 16px;
        }
        .panel h2 { font-size: 18px; margin-bottom: 12px; }
        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .stat { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; }
        .stat .label { opacity: 0.7; font-size: 13px; margin-bottom: 6px; }
        .stat .value { font-size: 20px; font-weight: 700; }
        .section-title { margin: 14px 0 8px; font-size: 15px; opacity: 0.9; }
        #screenshot {
            width: 100%; background: #0f172a; border: 1px solid #334155;
            border-radius: 8px; display: none; image-rendering: pixelated;
        }
        .placeholder { padding: 40px; text-align: center; background: #0f172a; border: 1px dashed #475569; border-radius: 8px; }
        .list { max-height: 260px; overflow-y: auto; border: 1px solid #334155; border-radius: 8px; }
        .item { padding: 10px; border-bottom: 1px solid #334155; }
        .item:last-child { border-bottom: none; }
        .history { max-height: 220px; overflow-y: auto; border: 1px solid #334155; border-radius: 8px; }
        .history .item { display: grid; gap: 6px; }
        .event.milestone { border-left: 4px solid #f59e0b; }
        .event.error { border-left: 4px solid #ef4444; }
        .event.info { border-left: 4px solid #38bdf8; }
        .small { font-size: 13px; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>宝可梦AI智能体 - 实时仪表盘</h1>
            <div class="subtitle">由 GPT-5.1 Codex 驱动 - 实时可视化</div>
            <div style="margin-top: 10px;">
                <span class="badge" id="connectionStatus">正在连接...</span>
                <span class="badge" id="turnCounter">回合: 0</span>
            </div>
        </header>

        <div class="grid">
            <div class="panel">
                <h2>游戏状态</h2>
                <div class="stats">
                    <div class="stat">
                        <div class="label">回合</div>
                        <div class="value" id="statTurn">0</div>
                    </div>
                    <div class="stat">
                        <div class="label">徽章</div>
                        <div class="value" id="statBadges">0/8</div>
                    </div>
                    <div class="stat">
                        <div class="label">金币</div>
                        <div class="value" id="statMoney">$0</div>
                    </div>
                    <div class="stat">
                        <div class="label">队伍</div>
                        <div class="value" id="statParty">0</div>
                    </div>
                </div>

                <div class="section-title">位置</div>
                <div class="stat">
                    <div id="positionInfo">地图: ?, 坐标: (?, ?)</div>
                </div>

                <div class="section-title">徽章</div>
                <div class="list" id="badgeGrid">
                    <div class="item">岩石</div>
                    <div class="item">蓝色</div>
                    <div class="item">橙色</div>
                    <div class="item">彩虹</div>
                    <div class="item">灵魂</div>
                    <div class="item">粉色</div>
                    <div class="item">深红</div>
                    <div class="item">绿色</div>
                </div>

                <div class="section-title">队伍宝可梦</div>
                <div class="list" id="partyList">
                    <div class="item small" style="text-align:center;">无宝可梦</div>
                </div>

                <div class="section-title">探索进度</div>
                <div class="stat">
                    <div id="explorationInfo">当前地图: 0.0%</div>
                    <div class="small" id="explorationDetails">格子: 0/0</div>
                </div>
            </div>

            <div class="panel">
                <h2>游戏画面</h2>
                <img id="screenshot" alt="游戏画面">
                <div class="placeholder" id="screenshotPlaceholder">等待游戏画面...</div>

                <h2 style="margin-top: 16px;">最新AI决策</h2>
                <div class="stat" id="latestDecision">
                    <div class="value" id="latestAction">等待首次决策...</div>
                    <div class="small" id="latestReasoning"></div>
                </div>

                <h2 style="margin-top: 16px;">视觉分析</h2>
                <div class="stat" id="visualAnalysis">
                    <div id="visualDesc">描述: -</div>
                    <div class="small" id="visualElements">元素: -</div>
                </div>
            </div>

            <div class="panel">
                <h2>当前目标</h2>
                <div class="list" id="goalsList">
                    <div class="item small" style="text-align:center;">未设置目标</div>
                </div>

                <h2 style="margin-top: 16px;">事件</h2>
                <div class="list" id="eventLog">
                    <div class="item event milestone">系统已初始化</div>
                </div>
            </div>
        </div>

        <div class="panel" style="margin-top: 16px;">
            <h2>决策历史</h2>
            <div class="history" id="historyList">
                <div class="item small" style="text-align:center; padding: 12px;">等待决策...</div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        socket.on('connect', () => {
            const cs = document.getElementById('connectionStatus');
            cs.textContent = '已连接';
            cs.style.background = '#22c55e';
        });

        socket.on('disconnect', () => {
            const cs = document.getElementById('connectionStatus');
            cs.textContent = '已断开';
            cs.style.background = '#ef4444';
        });

        socket.on('state_update', (state) => {
            document.getElementById('turnCounter').textContent = `回合: ${state.turn || 0}`;
            document.getElementById('statTurn').textContent = state.turn || 0;
            document.getElementById('statBadges').textContent = `${state.badges || 0}/8`;
            document.getElementById('statMoney').textContent = state.money ? `$${state.money}` : '$0';
            document.getElementById('statParty').textContent = state.party_size || 0;

            const pos = state.position || {};
            document.getElementById('positionInfo').textContent =
                `地图: ${pos.map_id ?? '?'}, 坐标: (${pos.x ?? '?'}, ${pos.y ?? '?'})`;

            // 探索信息
            if (state.exploration) {
                const explored = state.exploration.explored_tiles || 0;
                const total = state.exploration.total_tiles || 0;
                const percent = state.exploration.percentage || 0;
                document.getElementById('explorationInfo').textContent = `当前地图: ${percent}%`;
                document.getElementById('explorationDetails').textContent = `格子: ${explored}/${total}`;
            }

            // 视觉信息
            if (state.visual) {
                document.getElementById('visualDesc').textContent = `描述: ${state.visual.description || '-'}`;
                document.getElementById('visualElements').textContent = `元素: ${state.visual.elements || '-'}`;
            }

            // 徽章高亮
            if (typeof state.badges === 'number') {
                const badgeGrid = document.getElementById('badgeGrid').children;
                for (let i = 0; i < badgeGrid.length; i++) {
                    badgeGrid[i].style.opacity = i < state.badges ? '1' : '0.4';
                }
            }

            // 队伍
            const partyList = document.getElementById('partyList');
            partyList.innerHTML = '';
            const party = state.party || [];
            if (!party.length) {
                partyList.innerHTML = '<div class="item small" style="text-align:center;">无宝可梦</div>';
            } else {
                party.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'item';
                    div.innerHTML = `<strong>${p.name || '未知'}</strong> — 等级 ${p.level || '?'} | HP ${p.hp || '?'}`;
                    partyList.appendChild(div);
                });
            }
        });

        socket.on('decision_update', (decision) => {
            document.getElementById('latestAction').textContent = `动作: ${decision.action || 'wait'}`;
            document.getElementById('latestReasoning').textContent = decision.reasoning || '';

            const history = document.getElementById('historyList');
            const item = document.createElement('div');
            item.className = 'item';
            item.innerHTML = `<div><strong>回合 ${decision.turn ?? '-'}</strong> — 动作: ${decision.action || 'wait'}</div>
                              <div class="small">${decision.reasoning || ''}</div>
                              <div class="small">${decision.timestamp || ''}</div>`;
            if (history.children.length && history.children[0].classList.contains('small')) {
                history.innerHTML = '';
            }
            history.prepend(item);
            // 只保留最近 100 条
            while (history.children.length > 100) history.removeChild(history.lastChild);
        });

        socket.on('screenshot_update', (data) => {
            const img = document.getElementById('screenshot');
            const ph = document.getElementById('screenshotPlaceholder');
            img.src = data.image;
            img.style.display = 'block';
            ph.style.display = 'none';
        });

        socket.on('goals_update', (data) => {
            const list = document.getElementById('goalsList');
            list.innerHTML = '';
            const goals = data.goals || [];
            if (!goals.length) {
                list.innerHTML = '<div class="item small" style="text-align:center;">未设置目标</div>';
                return;
            }
            goals.forEach(g => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<strong>${g.type}</strong>: ${g.description}`;
                list.appendChild(div);
            });
        });

        socket.on('event', (evt) => {
            const log = document.getElementById('eventLog');
            const div = document.createElement('div');
            div.className = `item event ${evt.type || 'info'}`;
            div.innerHTML = `<div>${evt.message || ''}</div><div class="small">${evt.timestamp || ''}</div>`;
            log.prepend(div);
            while (log.children.length > 50) log.removeChild(log.lastChild);
        });
    </script>
</body>
</html>
