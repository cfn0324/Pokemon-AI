# Pokemon Red AI configuration

game:
  rom_path: "PokemonRed.gb"
  speed: 1
  headless: true
  save_state_dir: "data/checkpoints"
  auto_resume_latest_checkpoint: true
  resume_checkpoint: null
  max_checkpoints: 12
  prompt_for_checkpoint_on_start: true
  startup_checkpoint_recent_limit: 8
  landmark_checkpoints_enabled: true
  landmark_checkpoints:
    milestone_oaks_lab:
      label: "里程碑：大木研究所"
      map_id: 40
      max_party_size: 0
      max_badges: 0
    milestone_first_pokemon:
      label: "里程碑：获得第一只宝可梦"
      min_party_size: 1
      max_badges: 0
    milestone_route_1:
      label: "里程碑：1号道路"
      map_id: 12
      min_party_size: 1
      max_badges: 0
    milestone_viridian_city:
      label: "里程碑：常青市"
      map_id: 1
      min_party_size: 1
      max_badges: 0

ai:
  model: ""
  temperature: 0.4
  max_tokens: 4096
  decision_max_tokens: 480
  request_timeout_seconds: 30
  request_retries: 0
  request_retry_backoff_seconds: 0.5
  guidance_interval_turns: 40
  api_error_cooldown_seconds: 6
  api_error_cooldown_max_seconds: 30
  action_plan_enabled: true
  action_plan_max_actions: 4
  agents:
    main:
      model: ""
      temperature: 0.1
    pathfinder:
      model: ""
      temperature: 0.3
    puzzle_solver:
      model: ""
      temperature: 0.3
    critic:
      model: ""
      temperature: 0.5

memory:
  max_context_turns: 80
  summarization_enabled: true
  keep_recent_turns: 12
  map_memory_enabled: true
  save_interval: 50

state:
  story_guidance_enabled: true
  battle_guidance_enabled: true

actions:
  direction_repeat_attempts: 4
  delay_ms: 100
  timeout_seconds: 30
  stuck_threshold: 10
  screenshot_interval: 1
  async_wait_frames: 2
  async_wait_sleep_ms: 33
  early_battle_button_settle_frames: 30
  ai_battle_text_button_settle_frames: 24
  recent_battle_visual_grace_turns: 2

navigation:
  auto_plan_stall_turns: 3
  max_plan_path_length: 24

decision:
  llm_primary_mode: false
  llm_primary_action_plan_enabled: false
  ai_full_control_mode: false
  pure_llm_mode: true
  disable_runtime_fallbacks: true
  research_mode: false
  strict_response_format: true
  retry_same_turn_on_ai_error: true
  same_turn_retry_max_attempts: 12
  same_turn_retry_timeout_seconds: 45
  same_turn_retry_min_delay_seconds: 0.25

goals:
  primary_goal: "通过击败四天王并成为冠军来完成宝可梦红版"
  secondary_goal: null
  tertiary_goal: null
  goal_update_interval: 10

logging:
  level: "INFO"
  log_dir: "logs"
  log_actions: true
  log_states: true
  log_decisions: true
  save_screenshots: true
  annotate_screenshots: false
  screenshot_dir: "logs/screenshots"

progress:
  checkpoint_interval: 100
  track_badges: true
  track_pokemon: true
  track_items: true
  track_exploration: true

performance:
  enable_caching: true
  cache_dir: "data/cache"
  parallel_agents: false
  async_decisions: false
  visual_enabled: false

visualization:
  enabled: true
  port: 5000
  update_screenshots: true
  update_interval: 1
  stream_enabled: true
  stream_fps: 15
  stream_scale: 3
  stream_quality: 80
  max_fps: 8

debug:
  enabled: false
  break_on_error: false
  verbose_state: false
  save_ram_dumps: false

testing:
  max_turns: 0
  write_checkpoints: true
