# Pokemon Red AI 配置

game:
  rom_path: "PokemonRed.gb"
  speed: 1  # 0 = 无限制速度, 1 = 正常速度, 2+ = 较慢速度
  headless: true  # 不显示PyBoy窗口（推荐，改用Web仪表板）
  save_state_dir: "data/checkpoints"
  auto_resume_latest_checkpoint: true
  resume_checkpoint: null
  max_checkpoints: 12

ai:
  model: ""  # 在这里填写模型 ID，或通过 AI_MODEL 提供
  temperature: 0.4
  max_tokens: 4096
  decision_max_tokens: 320
  request_timeout_seconds: 45
  request_retries: 2
  request_retry_backoff_seconds: 1.0
  guidance_interval_turns: 25
  api_error_cooldown_seconds: 6
  api_error_cooldown_max_seconds: 30

  # 智能体特定设置
  agents:
    main:
      model: ""  # 留空时继承 ai.model 或对应环境变量
      temperature: 0.2
    pathfinder:
      model: ""
      temperature: 0.3  # 较低温度以获得更确定性的寻路
    puzzle_solver:
      model: ""
      temperature: 0.3
    critic:
      model: ""
      temperature: 0.5

memory:
  max_context_turns: 100  # 此回合数后进行摘要
  summarization_enabled: true
  keep_recent_turns: 20  # 保留最近N回合的完整细节
  map_memory_enabled: true
  save_interval: 50  # 每N回合保存地图记忆

actions:
  direction_repeat_attempts: 4
  delay_ms: 100  # 按键之间的延迟
  timeout_seconds: 30  # 等待状态改变的最长时间
  stuck_threshold: 10  # 重复相同行动N次 = 卡住
  screenshot_interval: 1  # 每N帧捕获一次

navigation:
  auto_plan_stall_turns: 3
  max_plan_path_length: 24

decision:
  pure_llm_mode: false  # Disable deterministic control stages and rely on the main model only
  strict_response_format: true  # Repair invalid model output instead of inferring missing fields heuristically
  retry_same_turn_on_ai_error: true  # In pure-LLM mode, retry transient AI failures without spending a gameplay turn
  same_turn_retry_max_attempts: 12
  same_turn_retry_timeout_seconds: 45
  same_turn_retry_min_delay_seconds: 0.25

goals:
  primary_goal: "通过击败四天王并成为冠军来完成宝可梦红版"
  secondary_goal: null  # 将动态设置
  tertiary_goal: null   # 将动态设置
  goal_update_interval: 10  # 每N回合重新评估目标

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_dir: "logs"
  log_actions: true
  log_states: true
  log_decisions: true
  save_screenshots: true
  screenshot_dir: "logs/screenshots"

progress:
  checkpoint_interval: 100  # 每N回合自动保存
  track_badges: true
  track_pokemon: true
  track_items: true
  track_exploration: true

performance:
  enable_caching: true
  cache_dir: "data/cache"
  parallel_agents: false  # 并行运行子智能体（实验性）
  async_decisions: true  # Keep gameplay responsive by letting the model think in the background
  visual_enabled: false  # Disable harness-side pixel CV; rely on raw screenshots plus RAM

visualization:
  enabled: true  # 启用基于Web的实时仪表板
  port: 5000  # 可视化服务器端口
  update_screenshots: true  # 向仪表板流式传输截图
  update_interval: 1  # 更新频率（每N回合）
  stream_enabled: true
  stream_fps: 15
  stream_scale: 3
  stream_quality: 80
  max_fps: 8

debug:
  enabled: false
  break_on_error: false
  verbose_state: false
  save_ram_dumps: false

testing:
  max_turns: 0
  write_checkpoints: true
